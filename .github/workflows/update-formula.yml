name: Update Formula

on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula name (e.g., construct-cli)'
        required: true
        type: string
      tag:
        description: 'Release tag (e.g., 1.0.1; optional v-prefix accepted)'
        required: true
        type: string
      repository:
        description: 'Source repository (e.g., EstebanForge/construct-cli)'
        required: true
        type: string
      ext:
        description: 'Release asset extension: tar.gz (default) or bare for single-binary assets'
        required: false
        type: string
        default: tar.gz
      assets:
        description: 'Comma-separated asset suffixes (default: macos-universal,linux-amd64,linux-arm64)'
        required: false
        type: string
        default: 'macos-universal,linux-amd64,linux-arm64'

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update formula
        run: |
          FORMULA="${{ github.event.inputs.formula }}"
          RAW_TAG="${{ github.event.inputs.tag }}"
          TAG="${RAW_TAG#v}"
          REPO="${{ github.event.inputs.repository }}"
          EXT="${{ github.event.inputs.ext }}"
          SUFFIXES="${{ github.event.inputs.assets }}"
          VERSION="${TAG}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "${VERSION}" =~ ^[0-9]{8}(\.[0-9]+)?$ ]]; then
            echo "Only stable SemVer or date tags are allowed for Homebrew updates (got: ${RAW_TAG})"
            exit 1
          fi
          
          echo "Updating $FORMULA to $VERSION ($TAG)..."
          
          # Function to process an artifact
          update_artifact() {
            local platform=$1
            local suffix=$2
            
            echo "Processing $platform..."
            
            # tar.gz assets carry the extension; bare single-binary
            # assets are the file itself.
            if [[ "${EXT}" == "bare" ]]; then
              local filename="${FORMULA}-${suffix}"
              local pattern="${suffix}"
            else
              local filename="${FORMULA}-${suffix}.tar.gz"
              local pattern="${suffix}.tar.gz"
            fi
            local download_url="https://github.com/${REPO}/releases/download/${TAG}/${filename}"
            
            # Download
            echo "  Downloading from $download_url"
            curl -L -f -o "$filename" "$download_url" || { echo "  Failed to download $filename"; return 1; }
            
            # Calculate SHA256
            local sha256
            sha256=$(sha256sum "$filename" | awk '{print $1}')
            echo "  SHA256: $sha256"
            
            # Clean up
            rm "$filename"
            
            # Update Formula: replace the URL line matching the suffix,
            # then the sha256 line right after it.
            sed -i "s|url \".*${pattern}\"|url \"${download_url}\"|" "Formula/${FORMULA}.rb"
            sed -i "/${pattern}/!b;n;c\    sha256 \"${sha256}\"" "Formula/${FORMULA}.rb"
          }
          
          # Update Version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "Formula/${FORMULA}.rb"
          
          # Update Artifacts
          IFS=',' read -ra SUFFIX_LIST <<< "${SUFFIXES}"
          for suffix in "${SUFFIX_LIST[@]}"; do
            update_artifact "${suffix}" "${suffix}"
          done
          
          # Verify changes
          git diff
          
          # Commit and push
          git add "Formula/${FORMULA}.rb"
          git commit -m "Update ${FORMULA} to ${TAG}" || echo "No changes to commit"
          git push
